[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (unused imports, undefined names),
# I: import sorting, B: bugbear (likely bugs), UP: modern Python syntax
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses function calls in default arguments

[tool.pytest.ini_options]
testpaths = ["."]

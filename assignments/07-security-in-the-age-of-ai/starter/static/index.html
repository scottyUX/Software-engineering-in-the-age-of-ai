<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bookstore Reviews</title>
</head>
<body>
  <h1>Reviews</h1>
  <div id="reviews"></div>
  <script>
    // SECURE: Render untrusted server data using safe DOM textContent instead of innerHTML
    async function load(bookId) {
      const res = await fetch('/reviews/' + bookId);
      const reviews = await res.json();
      const box = document.getElementById('reviews');
      box.innerHTML = '';
      reviews.forEach(t => {
        const p = document.createElement('p');
        p.textContent = t;
        box.appendChild(p);
      });
    }
    load(1);
  </script>
</body>
</html>
